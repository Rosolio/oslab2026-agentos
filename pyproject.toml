[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-agentos"
version = "0.1.0"
description = "面向课程资料整理的事件驱动 AgentOS"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<2", "watchdog>=4,<7", "streamlit>=1.37,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
agentos = "agentos.cli:main"

[tool.setuptools.packages.find]
include = ["agentos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "RUF100"]
